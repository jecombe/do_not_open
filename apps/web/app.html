<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17130F" />
    <meta name="description" content="Play DO NOT OPEN: mint sealed boxes, shake them, feed the cats and open one if you dare. Cats and holders stay encrypted on Zama's fhEVM." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DO NOT OPEN</title>
    <!-- The sealed box that opens on the game: drawn here so it shows before the bundle; src/intro.ts lifts it. -->
    <style>
      .intro { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; --s: min(64vmin, 330px); }
      .intro-back {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 55% 60% at 50% -5%, rgb(255 180 84 / 0.22), transparent 70%), radial-gradient(ellipse 50% 22% at 50% 78%, rgb(0 0 0 / 0.5), transparent 70%), #17130f;
        transition: opacity 0.6s ease 0.5s;
      }
      .intro-shake { position: relative; animation: intro-shake 2.2s ease-in-out 0.9s infinite; }
      .intro-box {
        position: relative; width: var(--s); height: var(--s); perspective: 900px;
        animation: intro-thud 0.35s ease-out 0.42s both;
        transition: transform 0.75s cubic-bezier(0.6, 0, 0.9, 0.4) 0.3s, opacity 0.35s ease 0.7s;
        filter: drop-shadow(0 calc(var(--s) * 0.06) calc(var(--s) * 0.08) rgb(0 0 0 / 0.6));
      }
      .intro-inside {
        position: absolute; inset: 0; border-radius: 2px;
        background: radial-gradient(circle at 50% 50%, #fff3d6 0%, #ffb454 30%, #7a4a1c 75%, #2a1d10 100%);
        opacity: 0.25; transition: opacity 0.35s ease;
      }
      .intro-flap { position: absolute; top: 0; bottom: 0; left: 0; width: 50%; overflow: hidden; transform-origin: 0 50%; backface-visibility: hidden;
        transition: transform 0.5s cubic-bezier(0.5, 0, 0.3, 1); }
      .intro-flap + .intro-flap { left: 50%; transform-origin: 100% 50%; }
      .intro-face {
        position: absolute; top: 0; left: 0; width: 200%; height: 100%;
        background: repeating-linear-gradient(90deg, rgb(0 0 0 / 0.035) 0 2px, transparent 2px 7px), linear-gradient(160deg, #c89a68, #b8895a 55%, #a4774b);
        box-shadow: inset 0 0 0 calc(var(--s) * 0.012) rgb(60 38 18 / 0.35);
      }
      .intro-flap + .intro-flap .intro-face { left: -100%; }
      .intro-face::before {
        content: ""; position: absolute; top: -2%; bottom: -2%; left: 41%; width: 18%;
        background: linear-gradient(90deg, rgb(255 255 255 / 0.18), transparent 30% 70%, rgb(0 0 0 / 0.08)), rgb(217 194 138 / 0.82);
        clip-path: polygon(0 1%, 20% 0, 45% 1.5%, 70% 0, 100% 1%, 100% 99%, 75% 100%, 50% 98.5%, 25% 100%, 0 99%);
      }
      .intro-face::after {
        content: "\25B2\25B2"; position: absolute; top: 6%; left: 7%;
        font: 700 calc(var(--s) * 0.06) / 1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.1em; color: rgb(28 24 20 / 0.55);
      }
      .intro-stamp {
        position: absolute; top: 50%; left: 50%; margin: 0; padding: 0.22em 0.45em 0.1em; white-space: nowrap;
        font: 700 calc(var(--s) * 0.125) / 1 "Stardos Stencil", "Arial Black", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: #c2261d;
        border: 0.11em solid #c2261d; outline: 0.035em solid #c2261d; outline-offset: -0.24em; mix-blend-mode: multiply;
        mask-image: radial-gradient(circle at 30% 40%, #000 55%, rgb(0 0 0 / 0.7) 70%, #000 85%);
        transform: translate(-50%, -50%) rotate(-7deg);
        animation: intro-stamp 0.42s cubic-bezier(0.2, 0, 0.2, 1) 0.2s both;
      }
      .intro.is-open { pointer-events: none; }
      .intro.is-open .intro-shake { animation: none; }
      .intro.is-open .intro-back { opacity: 0; }
      .intro.is-open .intro-inside { opacity: 1; }
      .intro.is-open .intro-flap { transform: rotateY(-112deg); }
      .intro.is-open .intro-flap + .intro-flap { transform: rotateY(112deg); }
      .intro.is-open .intro-box { transform: scale(6); opacity: 0; }
      @keyframes intro-stamp {
        0% { opacity: 0; transform: translate(-50%, -50%) rotate(-16deg) scale(2.6); }
        70% { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(0.96); }
        100% { opacity: 1; transform: translate(-50%, -50%) rotate(-7deg) scale(1); }
      }
      @keyframes intro-thud { 0% { transform: scale(1); } 30% { transform: scale(0.965) translateY(1.5%); } 100% { transform: scale(1); } }
      @keyframes intro-shake {
        0%, 52%, 100% { transform: none; }
        56% { transform: translateX(-3%) rotate(-4deg); }
        61% { transform: translateX(3%) rotate(3.5deg); }
        66% { transform: translateX(-2.4%) rotate(-3deg); }
        71% { transform: translateX(2%) rotate(2deg); }
        76% { transform: translateX(-0.8%) rotate(-0.8deg); }
        80% { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .intro, .intro * { animation: none !important; }
        .intro-box, .intro-flap { transition: none; }
        .intro { transition: opacity 0.4s ease; }
        .intro.is-open { opacity: 0; }
        .intro.is-open .intro-box, .intro.is-open .intro-flap, .intro.is-open .intro-flap + .intro-flap { transform: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-back"></div>
      <div class="intro-shake">
        <div class="intro-box">
          <div class="intro-inside"></div>
          <div class="intro-flap"><div class="intro-face"><p class="intro-stamp">Do not open</p></div></div>
        </div>
      </div>
    </div>
    <script>
      // The right flap is the left one again, showing the other half of the lid: opened, the tape and the stamp split in two.
      (function () {
        var flap = document.querySelector("#intro .intro-flap");
        flap.parentNode.appendChild(flap.cloneNode(true));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
