<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090C" />

    <!-- Not prerendered (one page for every language, read from ?lang=), so its sharing tags are written here. -->
    <link rel="canonical" href="https://vault.do-not-open.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DO NOT OPEN" />
    <meta property="og:title" content="The sealed vault · DO NOT OPEN" />
    <meta property="og:description" content="Put any NFT in a sealed box: nobody can tell who holds it. Sell it on Seaport with the vault as the seller, or privately for a secret price." />
    <meta property="og:url" content="https://vault.do-not-open.app/" />
    <meta property="og:image" content="https://do-not-open.app/og-vault.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The sealed vault · DO NOT OPEN" />
    <meta name="twitter:description" content="Put any NFT in a sealed box: nobody can tell who holds it. Sell it on Seaport with the vault as the seller, or privately for a secret price." />
    <meta name="twitter:image" content="https://do-not-open.app/og-vault.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The vault door that opens on the page: drawn here so it shows before the bundle; src/intro.ts lifts it. -->
    <style>
      .intro { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; pointer-events: none; }
      .intro-leaf {
        position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 26px;
        background: radial-gradient(ellipse 60% 45% at 50% 46%, rgb(91 227 194 / 0.09), transparent 70%),
          linear-gradient(#141b24 1px, transparent 1px) 0 0 / 48px 48px, linear-gradient(90deg, #141b24 1px, transparent 1px) 0 0 / 48px 48px, #07090c;
        pointer-events: auto;
        transition: transform 0.85s cubic-bezier(0.7, 0, 0.2, 1) 0.25s;
      }
      .intro-leaf:first-child { clip-path: inset(0 50% 0 0); box-shadow: inset -1px 0 #2a3644; }
      .intro-leaf + .intro-leaf { clip-path: inset(0 0 0 50%); }
      .intro-dial { width: min(64vmin, 340px); height: auto; overflow: visible; }
      .intro-dial * { transform-origin: 0 0; }
      .intro-ticks { animation: intro-spin 14s linear infinite; }
      .intro-ring { animation: intro-spin 9s linear infinite reverse; }
      .intro-wheel { animation: intro-dial 2.4s cubic-bezier(0.6, 0, 0.3, 1) infinite; }
      .intro-arc { stroke-dasharray: 100; stroke-dashoffset: 100; animation: intro-fill 1.6s cubic-bezier(0.3, 0, 0.2, 1) forwards; }
      .intro-core { animation: intro-pulse 1.6s ease-in-out infinite; }
      .intro-hex { margin: 0; font: 13px/1 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.18em; color: #5a6676; white-space: pre; }
      .intro-hex b { font-weight: inherit; color: #5be3c2; }
      .intro-seam {
        position: absolute; top: 50%; left: 50%; width: 2px; height: 100%; translate: -50% -50%; scale: 1 0;
        background: #5be3c2; box-shadow: 0 0 18px 4px rgb(91 227 194 / 0.6), 0 0 80px 20px rgb(91 227 194 / 0.25);
        opacity: 0; transition: scale 0.3s cubic-bezier(0.2, 0, 0, 1);
      }
      .intro.is-open .intro-leaf:first-child { transform: translateX(-51%); }
      .intro.is-open .intro-leaf + .intro-leaf { transform: translateX(51%); }
      .intro.is-open .intro-leaf { pointer-events: none; }
      .intro.is-open .intro-seam { scale: 1 1; animation: intro-flash 1s ease forwards; }
      .intro.is-open .intro-wheel { animation: none; transform: rotate(90deg); transition: transform 0.3s cubic-bezier(0.5, 0, 0.2, 1.4); }
      .intro.is-open .intro-arc { stroke-dashoffset: 0; }
      @keyframes intro-spin { to { transform: rotate(360deg); } }
      @keyframes intro-dial { 0%, 15% { transform: rotate(0); } 40%, 55% { transform: rotate(-70deg); } 80%, 100% { transform: rotate(0); } }
      @keyframes intro-fill { 0% { stroke-dashoffset: 100; } 70% { stroke-dashoffset: 18; } 100% { stroke-dashoffset: 8; } }
      @keyframes intro-pulse { 50% { opacity: 0.45; } }
      @keyframes intro-flash { 0%, 35% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .intro *, .intro { animation: none !important; }
        .intro-leaf { transition: opacity 0.4s ease; }
        .intro.is-open .intro-leaf:first-child, .intro.is-open .intro-leaf + .intro-leaf { transform: none; opacity: 0; }
        .intro-seam { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-leaf">
        <svg class="intro-dial" viewBox="-100 -100 200 200" fill="none">
          <circle r="98" stroke="#2a3644" stroke-width="1.5" />
          <circle r="92" fill="#0d1117" stroke="#1c2530" stroke-width="2" />
          <circle class="intro-ticks" r="86" stroke="#2a3644" stroke-width="7" stroke-dasharray="1.2 4.2" />
          <circle class="intro-arc" r="77" stroke="#5be3c2" stroke-width="2" pathLength="100" transform="rotate(-90)" />
          <g class="intro-ring">
            <circle r="68" stroke="#1c2530" stroke-width="9" stroke-dasharray="30 6" />
            <circle cx="0" cy="-68" r="3" fill="#5be3c2" />
          </g>
          <g class="intro-wheel" stroke="#8b97a6" stroke-width="5" stroke-linecap="round">
            <path d="M0 -50V-17M0 50V17M-50 0H-17M50 0H17M-35 -35L-12 -12M35 35L12 12M-35 35L-12 12M35 -35L12 -12" stroke-opacity="0.55" />
            <circle r="50" stroke="#2a3644" stroke-width="3" />
            <circle r="16" fill="#111821" stroke="#2a3644" stroke-width="3" />
          </g>
          <circle class="intro-core" r="6" fill="#5be3c2" />
        </svg>
        <p class="intro-hex">0x5ea1ed&middot;fhe&middot;0000</p>
      </div>
      <i class="intro-seam"></i>
    </div>
    <script>
      // The right leaf of the door is the left one again, cut on its other half; the code under the dial deciphers itself.
      (function () {
        var intro = document.getElementById("intro");
        var leaf = intro.firstElementChild;
        intro.insertBefore(leaf.cloneNode(true), leaf.nextSibling);
        var shown = intro.querySelectorAll(".intro-hex");
        var plain = "0x5ea1ed\u00b7fhe\u00b7open";
        var hex = "0123456789abcdef";
        var start = Date.now();
        var timer = setInterval(function () {
          if (!intro.isConnected) return clearInterval(timer);
          var done = intro.classList.contains("is-open") ? plain.length : Math.floor(((Date.now() - start) / 1600) * plain.length * 0.85);
          var html = "<b>" + plain.slice(0, done) + "</b>";
          for (var i = done; i < plain.length; i++) html += plain[i] === "\u00b7" ? "\u00b7" : hex[(Math.random() * 16) | 0];
          for (var j = 0; j < shown.length; j++) shown[j].innerHTML = html;
        }, 60);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/vault/main.tsx"></script>
  </body>
</html>
