# Every series carries `network` (sepolia, mainnet) from its API job, or `network="server"` for
# what the networks share: the machine, its containers. An API runs as several replicas and one
# indexer: Prometheus finds each process by DNS on the edge network and labels it `role` (api or
# indexer), so each replica is scraped on its own. Public URLs: one file per network in probes/.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The testnet API (deploy/docker-compose.yml): replicas under the alias dno-api, the indexer
  # under dno-indexer. Looked up again every 15 s, so a deploy's new replicas show up at once.
  - job_name: dno-api-sepolia
    metrics_path: /metrics
    dns_sd_configs:
      - names: [dno-api, dno-indexer]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - target_label: job
        replacement: dno-api
      - source_labels: [__meta_dns_name]
        regex: dno-indexer.*
        target_label: role
        replacement: indexer
      - source_labels: [__meta_dns_name]
        regex: dno-api(-mainnet)?
        target_label: role
        replacement: api
      - target_label: network
        replacement: sepolia

  # At the mainnet launch: the mainnet stack's aliases (dno-api-mainnet, dno-indexer-mainnet).
  # - job_name: dno-api-mainnet
  #   metrics_path: /metrics
  #   dns_sd_configs:
  #     - names: [dno-api-mainnet, dno-indexer-mainnet]
  #       type: A
  #       port: 8080
  #       refresh_interval: 15s
  #   relabel_configs:
  #     - target_label: job
  #       replacement: dno-api
  #     - source_labels: [__meta_dns_name]
  #       regex: dno-indexer.*
  #       target_label: role
  #       replacement: indexer
  #     - source_labels: [__meta_dns_name]
  #       regex: dno-api(-mainnet)?
  #       target_label: role
  #       replacement: api
  #     - target_label: network
  #       replacement: mainnet

  - job_name: probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/probes/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { network: server }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { network: server }
    metric_relabel_configs:
      # Containers only, not every cgroup of the machine.
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { network: server }
