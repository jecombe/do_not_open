# Every series carries `network` (sepolia, mainnet) from its target file, or `network="server"`
# for what the networks share: the machine, its containers. Add a network by dropping a file in
# targets/ (its API) and probes/ (its public URLs): Prometheus reads them again on its own.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: dno-api
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]

  - job_name: probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/probes/*.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { network: server }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { network: server }
    metric_relabel_configs:
      # Containers only, not every cgroup of the machine.
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { network: server }
