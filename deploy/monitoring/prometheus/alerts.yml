# Every alert keeps the `network` label (sepolia, mainnet, server), so Discord says which one.
# Blocks are about 12 s on Sepolia and on Ethereum mainnet: 150 blocks is half an hour.
groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: up{job="dno-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "The {{ $labels.network }} API does not answer Prometheus ({{ $labels.instance }})."

      - alert: ApiServerErrors
        expr: sum by (network) (rate(dno_http_request_duration_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | printf \"%.2f\" }} server errors a second for 10 minutes."

      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (network, le) (rate(dno_http_request_duration_seconds_bucket{route!~"/relayer/.*|/v1/chat|/metrics"}[10m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "95% of reads take up to {{ $value | printf \"%.1f\" }} s (relayer and chat left out)."

  - name: indexer
    rules:
      - alert: IndexerStalled
        expr: time() - dno_indexer_last_pass_timestamp_seconds > 300 and dno_indexer_last_pass_timestamp_seconds > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No sync pass has finished for {{ $value | humanizeDuration }}."

      - alert: IndexerLagging
        expr: dno_indexer_lag_blocks > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The index is {{ $value }} blocks behind the chain: the app falls back on the RPC."

      - alert: IndexerFailing
        expr: dno_indexer_consecutive_failures >= 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} sync passes failed in a row."

      - alert: TaskFailing
        expr: dno_task_failing == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The periodic task {{ $labels.task }} keeps failing (finality sweep, reconciliation, Arweave, herald)."

      - alert: RpcPoolDegraded
        expr: count by (network) (dno_rpc_healthy == 1) < 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Fewer than two free RPC endpoints are healthy."

  - name: protocol
    rules:
      - alert: ProofStuck
        expr: dno_request_oldest_pending_blocks > 150
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A request has waited {{ $value }} blocks for its KMS proof: nobody finalized it (relayer or KMS down?)."

      - alert: HeraldPostsFailing
        expr: increase(dno_herald_posts{status="failed"}[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The herald could not post on {{ $labels.network_account }} in the last hour."

      - alert: ChatQuotaNearlyUsed
        expr: dno_chat_model_questions_today / dno_chat_model_questions_limit > 0.9 and dno_chat_model_questions_limit > 0
        labels: { severity: info }
        annotations:
          summary: "The manual's chatbot used {{ $value | humanizePercentage }} of today's Gemini questions; past it, it quotes the manual."

  - name: public-urls
    rules:
      - alert: UrlDown
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} does not answer from the server."

      - alert: CertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }} (Caddy renews at 30 days: it is stuck)."

  - name: studio
    rules:
      - alert: StudioBudgetNearlySpent
        expr: dno_studio_spent_today_usd / dno_studio_daily_budget_usd > 0.8 and dno_studio_daily_budget_usd > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The studio spent {{ $value | humanizePercentage }} of today's AI budget (STUDIO_DAILY_BUDGET_USD): unusual traffic, or a budget too small."

      - alert: StudioBudgetSpent
        expr: dno_studio_spent_today_usd / dno_studio_daily_budget_usd >= 0.98 and dno_studio_daily_budget_usd > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The studio spent today's AI budget: players with packs cannot generate until midnight UTC."

      - alert: StudioFailing
        expr: |
          sum by (network) (delta(dno_studio_jobs{status=~"failed|rejected"}[1h])) > 5
          and sum by (network) (delta(dno_studio_jobs{status=~"failed|rejected"}[1h]))
            / clamp_min(sum by (network) (delta(dno_studio_jobs[1h])), 1) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 30% of the studio's generations failed or were refused in the last hour: fal down, a wrong model id, or someone farming refunds."

      - alert: StudioJobsPilingUp
        expr: sum by (network) (dno_studio_jobs{status="running"}) > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} studio generations have been running for 15 minutes: fal's queue is stuck."

      - alert: StudioClosedWithPacksSold
        expr: dno_studio_open == 0 and dno_studio_packs_sold > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The studio is off (no FAL_KEY, no contract, or STUDIO_PAUSED) although packs were sold: buyers cannot spend them."

      - alert: StudioLosingMoney
        expr: dno_studio_spent_total_usd > dno_studio_revenue_usdc and dno_studio_spent_total_usd > 5
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The studio's AI services cost more than its packs brought in: check fal's prices against studio.json, or STUDIO_ALLOWLIST on a test network."

  - name: whitelist
    rules:
      - alert: WhitelistNearlyFull
        expr: dno_whitelist_seats_places > 0 and dno_whitelist_seats_taken / dno_whitelist_seats_places >= 0.9 and dno_whitelist_seats_taken < dno_whitelist_seats_places
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of the whitelist's seats are taken: raise ALLOW_LIST_PLACES or announce the last seats."

      - alert: WhitelistFull
        expr: dno_whitelist_seats_places > 0 and dno_whitelist_seats_taken >= dno_whitelist_seats_places
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Every seat on the whitelist is taken: new players are refused (list-full) until ALLOW_LIST_PLACES is raised."

      - alert: XSignInFailing
        expr: |
          sum by (network) (increase(dno_xpass_sign_ins_total{outcome="x-down"}[30m])) > 3
          and sum by (network) (increase(dno_xpass_sign_ins_total{outcome="x-down"}[30m]))
            / clamp_min(sum by (network) (increase(dno_xpass_sign_ins_total[30m])), 1) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Most Sign in with X attempts fail on X's side: a wrong X_CLIENT_SECRET, a callback URL changed on developer.x.com, or X down."

      - alert: XSignInTurnedOff
        expr: dno_xpass_signin_enabled == 0 and max_over_time(dno_xpass_signin_enabled[1d]) == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Sign in with X was on and is now off: X_CLIENT_ID is missing from the API's .env after a restart."

      - alert: IdeasPouringIn
        expr: increase(dno_ideas_received[1h]) > 50
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} ideas in the suggestion box in an hour: someone may be spamming it."

  - name: server
    rules:
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The server's disk is {{ $value | humanizePercentage }} full."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of the server's memory is available."

      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name=~"dno.*"} / container_spec_memory_limit_bytes{name=~"dno.*"} > 0.9 and container_spec_memory_limit_bytes{name=~"dno.*"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} uses {{ $value | humanizePercentage }} of its memory limit: it will be killed and restarted."

