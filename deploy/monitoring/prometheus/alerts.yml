# Every alert keeps the `network` label (sepolia, mainnet, server), so Discord says which one.
# Blocks are about 12 s on Sepolia and on Ethereum mainnet: 150 blocks is half an hour.
groups:
  - name: api
    rules:
      - alert: ApiReplicaDown
        expr: up{job="dno-api",role="api"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "A {{ $labels.network }} API replica does not answer Prometheus ({{ $labels.instance }}); the others carry its traffic."

      - alert: ApiNoReplica
        expr: sum by (network) (up{job="dno-api",role="api"}) < 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "No {{ $labels.network }} API replica answers: the API is down."

      - alert: IndexerDown
        expr: up{job="dno-api",role="indexer"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "The {{ $labels.network }} indexer does not answer Prometheus ({{ $labels.instance }}): the index stops moving."

      - alert: ApiRestarting
        expr: changes(process_start_time_seconds{job="dno-api"}[30m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "A {{ $labels.network }} {{ $labels.role }} process restarted {{ $value }} times in 30 minutes ({{ $labels.instance }}): out of memory, or crashing."

      - alert: ApiEventLoopBlocked
        expr: nodejs_eventloop_lag_p99_seconds{job="dno-api",role="api"} > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A {{ $labels.network }} API replica's event loop lags {{ $value | printf \"%.2f\" }} s (p99, {{ $labels.instance }}): it is saturated, add a replica (API_REPLICAS)."

      - alert: ApiServerErrors
        expr: sum by (network) (rate(dno_http_request_duration_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | printf \"%.2f\" }} server errors a second for 10 minutes."

      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (network, le) (rate(dno_http_request_duration_seconds_bucket{route!~"/relayer/.*|/v1/chat|/metrics"}[10m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "95% of reads take up to {{ $value | printf \"%.1f\" }} s (relayer and chat left out)."

  - name: indexer
    rules:
      - alert: IndexerStalled
        expr: time() - dno_indexer_last_pass_timestamp_seconds > 300 and dno_indexer_last_pass_timestamp_seconds > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No sync pass has finished for {{ $value | humanizeDuration }}."

      - alert: IndexerLagging
        expr: dno_indexer_lag_blocks > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The index is {{ $value }} blocks behind the chain: the app falls back on the RPC."

      - alert: IndexerFailing
        expr: dno_indexer_consecutive_failures >= 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} sync passes failed in a row."

      - alert: TaskFailing
        expr: dno_task_failing == 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The periodic task {{ $labels.task }} keeps failing (finality sweep, reconciliation, Arweave, herald)."

      - alert: RpcPoolDegraded
        expr: count by (network, role, instance) (dno_rpc_healthy == 1) < 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Fewer than two free RPC endpoints are healthy for {{ $labels.role }} {{ $labels.instance }}."

  - name: protocol
    rules:
      - alert: ProofStuck
        expr: dno_request_oldest_pending_blocks > 150
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A request has waited {{ $value }} blocks for its KMS proof: nobody finalized it (relayer or KMS down?)."

      - alert: HeraldPostsFailing
        expr: increase(dno_herald_posts{status="failed"}[1h]) > 0
        labels: { severity: warning }
        annotations:
          summary: "The herald could not post on {{ $labels.network_account }} in the last hour."

      - alert: ChatQuotaNearlyUsed
        expr: dno_chat_model_questions_today / dno_chat_model_questions_limit > 0.9 and dno_chat_model_questions_limit > 0
        labels: { severity: info }
        annotations:
          summary: "The manual's chatbot used {{ $value | humanizePercentage }} of today's Gemini questions; past it, it quotes the manual."

  - name: public-urls
    rules:
      - alert: UrlDown
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} does not answer from the server."

      - alert: CertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }} (Caddy renews at 30 days: it is stuck)."

  - name: vault
    rules:
      # The relayer's wallet pays the gas of every request and proof it sends for holders.
      - alert: VaultRelayerLow
        expr: max by (network) (dno_vault_relayer_balance_eth) < 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The vault relayer has {{ $value | printf \"%.4f\" }} ETH left: top up its wallet (VAULT_RELAYER_KEY) before holders' withdrawals and listings stop going through it."

      - alert: VaultRelayerEmpty
        expr: max by (network) (dno_vault_relayer_balance_eth) < 0.005
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The vault relayer is out of gas ({{ $value | printf \"%.4f\" }} ETH): holders can only send their requests from their own wallet, which shows their address."

      - alert: VaultRelayFailing
        expr: sum by (network) (increase(dno_vault_relays_total{outcome="failed"}[15m])) >= 3
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} vault relays failed to send in 15 minutes: the node, the nonce or the relayer's gas (see the API logs)."

      - alert: VaultRelayerCapNear
        expr: max by (network) (dno_vault_relayer_sent_today / dno_vault_relayer_daily_cap) > 0.8 and max by (network) (dno_vault_relayer_daily_cap) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A replica's vault relayer sent {{ $value | humanizePercentage }} of today's cap (VAULT_RELAY_PER_DAY): past it, holders must send from their wallet until midnight UTC."

      - alert: VaultRequestsStuck
        expr: max by (network) (dno_vault_requests_pending) > 0 and max by (network) (dno_vault_requests_pending offset 1h) > 0 and max by (network) (dno_vault_requests_settled) == max by (network) (dno_vault_requests_settled offset 1h)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} vault request(s) have waited over an hour for their proof and none settled: the relayer or Zama's KMS (the box stays busy until then)."

      # What happened, for the team's activity channel.
      - alert: VaultDeposits
        expr: max by (network) (dno_vault_deposits) - max by (network) (dno_vault_deposits offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            🔐 {{ $value | printf "%.0f" }} NFT(s) sealed in the vault in 15 minutes ({{ with printf `sum(max by (state) (dno_vault_boxes{network="%s",state=~"sealed|listed|sold"}))` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} inside now).

      - alert: VaultSeaportSales
        expr: max by (network) (dno_vault_seaport_sales) - max by (network) (dno_vault_seaport_sales offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            🛒 {{ $value | printf "%.0f" }} vault box(es) sold on Seaport in 15 minutes ({{ with printf `max(dno_vault_seaport_volume_eth{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.4f" }}{{ end }} ETH in all).

      - alert: VaultPrivateSales
        expr: max by (network) (dno_vault_private_sales{status="settled"}) - max by (network) (dno_vault_private_sales{status="settled"} offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "🤝 {{ $value | printf \"%.0f\" }} private vault sale(s) settled in 15 minutes (price and outcome encrypted)."

      - alert: VaultWithdrawals
        expr: max by (network) (dno_vault_withdrawals) - max by (network) (dno_vault_withdrawals offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "📤 {{ $value | printf \"%.0f\" }} NFT(s) taken out of the vault in 15 minutes."

  - name: studio
    rules:
      - alert: StudioBudgetNearlySpent
        expr: dno_studio_spent_today_usd / dno_studio_daily_budget_usd > 0.8 and dno_studio_daily_budget_usd > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The studio spent {{ $value | humanizePercentage }} of today's AI budget (STUDIO_DAILY_BUDGET_USD): unusual traffic, or a budget too small."

      - alert: StudioBudgetSpent
        expr: dno_studio_spent_today_usd / dno_studio_daily_budget_usd >= 0.98 and dno_studio_daily_budget_usd > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The studio spent today's AI budget: players with packs cannot generate until midnight UTC."

      - alert: StudioFailing
        expr: |
          sum by (network) (delta(dno_studio_jobs{status=~"failed|rejected"}[1h])) > 5
          and sum by (network) (delta(dno_studio_jobs{status=~"failed|rejected"}[1h]))
            / clamp_min(sum by (network) (delta(dno_studio_jobs[1h])), 1) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 30% of the studio's generations failed or were refused in the last hour: fal down, a wrong model id, or someone farming refunds."

      - alert: StudioJobsPilingUp
        expr: sum by (network) (dno_studio_jobs{status="running"}) > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} studio generations have been running for 15 minutes: fal's queue is stuck."

      - alert: StudioClosedWithPacksSold
        expr: dno_studio_open == 0 and dno_studio_packs_sold > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "The studio is off (no FAL_KEY, no contract, or STUDIO_PAUSED) although packs were sold: buyers cannot spend them."

      - alert: StudioLosingMoney
        expr: dno_studio_spent_total_usd > dno_studio_revenue_usdc and dno_studio_spent_total_usd > 5
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The studio's AI services cost more than its packs brought in: check fal's prices against studio.json, or STUDIO_ALLOWLIST on a test network."

  - name: whitelist
    rules:
      - alert: WhitelistNearlyFull
        expr: dno_whitelist_seats_places > 0 and dno_whitelist_seats_taken / dno_whitelist_seats_places >= 0.9 and dno_whitelist_seats_taken < dno_whitelist_seats_places
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of the whitelist's seats are taken: raise ALLOW_LIST_PLACES or announce the last seats."

      - alert: WhitelistFull
        expr: dno_whitelist_seats_places > 0 and dno_whitelist_seats_taken >= dno_whitelist_seats_places
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Every seat on the whitelist is taken: new players are refused (list-full) until ALLOW_LIST_PLACES is raised."

      - alert: XSignInFailing
        expr: |
          sum by (network) (increase(dno_xpass_sign_ins_total{outcome="x-down"}[30m])) > 3
          and sum by (network) (increase(dno_xpass_sign_ins_total{outcome="x-down"}[30m]))
            / clamp_min(sum by (network) (increase(dno_xpass_sign_ins_total[30m])), 1) > 0.3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Most Sign in with X attempts fail on X's side: a wrong X_CLIENT_SECRET, a callback URL changed on developer.x.com, or X down."

      - alert: XSignInTurnedOff
        expr: dno_xpass_signin_enabled == 0 and max_over_time(dno_xpass_signin_enabled[1d]) == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Sign in with X was on and is now off: X_CLIENT_ID is missing from the API's .env after a restart."

      - alert: IdeasPouringIn
        expr: increase(dno_ideas_received[1h]) > 50
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} ideas in the suggestion box in an hour: someone may be spamming it."

  # What players do, not what breaks: severity "activity" goes to Discord without a "resolved"
  # message (alertmanager.yml). Each compares a count the indexer reports with 15 minutes ago,
  # through max by (network) so a redeployed indexer (a new instance label) does not count twice.
  # A burst posts once; still going after 30 minutes, it posts again with the new count.
  - name: activity
    rules:
      - alert: BoardingPasses
        expr: max by (network) (dno_xpass_passes{stage="started"}) - max by (network) (dno_xpass_passes{stage="started"} offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            🎫 {{ $value | printf "%.0f" }} new boarding pass(es) in 15 minutes. All passes: {{ with printf `max(dno_xpass_passes{network="%s",stage="started"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} started, {{ with printf `max(dno_xpass_passes{network="%s",stage="connected"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} with X, {{ with printf `max(dno_xpass_passes{network="%s",stage="seated"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} seated, {{ with printf `max(dno_xpass_passes{network="%s",stage="wallet"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} with a wallet.

      - alert: BoardingConnectedX
        expr: max by (network) (dno_xpass_passes{stage="connected"}) - max by (network) (dno_xpass_passes{stage="connected"} offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "𝕏 {{ $value | printf \"%.0f\" }} boarding pass(es) connected an X account in 15 minutes."

      - alert: BoardingSeated
        expr: max by (network) (dno_xpass_passes{stage="seated"}) - max by (network) (dno_xpass_passes{stage="seated"} offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            💺 {{ $value | printf "%.0f" }} boarding pass(es) did every task and took a seat in 15 minutes. Seats: {{ with printf `max(dno_whitelist_seats_taken{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} taken{{ with printf `max(dno_whitelist_seats_places{network="%s"}) > 0` $labels.network | query }} of {{ . | first | value | printf "%.0f" }}{{ end }}.

      - alert: WhitelistClaims
        expr: max by (network) (dno_whitelist_claims) - max by (network) (dno_whitelist_claims offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "✍️ {{ $value | printf \"%.0f\" }} wallet(s) signed for a place on the whitelist in 15 minutes."

      - alert: IdeasReceived
        expr: max by (network) (dno_ideas_received) - max by (network) (dno_ideas_received offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "💡 {{ $value | printf \"%.0f\" }} new idea(s) in the suggestion box in 15 minutes (/v1/ideas with the admin token)."

      - alert: NewPlayers
        expr: max by (network) (dno_users) - max by (network) (dno_users offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "👋 {{ $value | printf \"%.0f\" }} new address(es) acted on-chain or signed in for the first time in 15 minutes."

      - alert: BoxesSold
        expr: max by (network) (dno_boxes_minted) - max by (network) (dno_boxes_minted offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            📦 {{ $value | printf "%.0f" }} box(es) left the depot in 15 minutes ({{ with printf `max(dno_boxes_minted{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} in all).

      - alert: BoxesOpened
        expr: max by (network) (dno_boxes_opened) - max by (network) (dno_boxes_opened offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            🐈 {{ $value | printf "%.0f" }} box(es) opened in 15 minutes ({{ with printf `max(dno_boxes_opened{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ end }} in all).

      - alert: DuelsPosted
        expr: max by (network) (dno_duels) - max by (network) (dno_duels offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "⚔️ {{ $value | printf \"%.0f\" }} duel(s) posted on the shelf in 15 minutes."

      - alert: MilestoneReached
        expr: max by (network) (dno_milestones_reached) - max by (network) (dno_milestones_reached offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: "🏁 A sale milestone was reached ({{ with printf `max(dno_milestones_reached{network=\"%s\"})` $labels.network | query }}{{ . | first | value | printf \"%.0f\" }}{{ end }} so far)."

      - alert: RatsAdopted
        expr: sum by (network) (max by (network, kind) (dno_rats_minted)) - sum by (network) (max by (network, kind) (dno_rats_minted offset 15m)) > 0
        labels: { severity: activity }
        annotations:
          summary: "🐀 {{ $value | printf \"%.0f\" }} rat(s) adopted in 15 minutes."

      - alert: StudioPacksSold
        expr: max by (network) (dno_studio_packs_sold) - max by (network) (dno_studio_packs_sold offset 15m) > 0
        labels: { severity: activity }
        annotations:
          summary: |-
            🎨 {{ $value | printf "%.0f" }} studio pack(s) sold in 15 minutes ({{ with printf `max(dno_studio_revenue_usdc{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.2f" }}{{ end }} USDC in all).

      - alert: TrafficSpike
        expr: |
          sum by (network) (rate(dno_http_request_duration_seconds_count{route!~"/metrics|/health"}[15m])) > 0.5
          and sum by (network) (rate(dno_http_request_duration_seconds_count{route!~"/metrics|/health"}[15m]))
            > 3 * sum by (network) (rate(dno_http_request_duration_seconds_count{route!~"/metrics|/health"}[1d] offset 15m))
        for: 5m
        labels: { severity: activity }
        annotations:
          summary: "📈 The API serves {{ $value | printf \"%.1f\" }} requests a second, over three times its usual rate: people are on the site (or a bot)."

      # A recap at 08:00 UTC: what the last 24 hours brought. It also proves, once a day, that
      # Alertmanager still reaches Discord.
      - alert: DailyRecap
        expr: max by (network) (dno_info{role="indexer"}) and on () (hour() == 8 and on () minute() < 10)
        labels: { severity: digest }
        annotations:
          summary: |-
            Last 24 hours (all-time in brackets):
            🎫 boarding passes +{{ with printf `max(dno_xpass_passes{network="%[1]s",stage="started"}) - max(dno_xpass_passes{network="%[1]s",stage="started"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} ({{ with printf `max(dno_xpass_passes{network="%s",stage="started"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}–{{ end }}), seated +{{ with printf `max(dno_xpass_passes{network="%[1]s",stage="seated"}) - max(dno_xpass_passes{network="%[1]s",stage="seated"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} ({{ with printf `max(dno_whitelist_seats_taken{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}–{{ end }} seats taken)
            ✍️ whitelist claims +{{ with printf `max(dno_whitelist_claims{network="%[1]s"}) - max(dno_whitelist_claims{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · 💡 ideas +{{ with printf `max(dno_ideas_received{network="%[1]s"}) - max(dno_ideas_received{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }}
            👋 new addresses +{{ with printf `max(dno_users{network="%[1]s"}) - max(dno_users{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} ({{ with printf `max(dno_users{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}–{{ end }})
            📦 boxes sold +{{ with printf `max(dno_boxes_minted{network="%[1]s"}) - max(dno_boxes_minted{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} ({{ with printf `max(dno_boxes_minted{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}–{{ end }}) · 🐈 opened +{{ with printf `max(dno_boxes_opened{network="%[1]s"}) - max(dno_boxes_opened{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · ⚔️ duels +{{ with printf `max(dno_duels{network="%[1]s"}) - max(dno_duels{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }}
            🐀 rats +{{ with printf `sum(max by (kind) (dno_rats_minted{network="%[1]s"})) - sum(max by (kind) (dno_rats_minted{network="%[1]s"} offset 1d))` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · 🎨 studio packs +{{ with printf `max(dno_studio_packs_sold{network="%[1]s"}) - max(dno_studio_packs_sold{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }}
            🔐 vault deposits +{{ with printf `max(dno_vault_deposits{network="%[1]s"}) - max(dno_vault_deposits{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · 🛒 Seaport sales +{{ with printf `max(dno_vault_seaport_sales{network="%[1]s"}) - max(dno_vault_seaport_sales{network="%[1]s"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · 🤝 private sales +{{ with printf `max(dno_vault_private_sales{network="%[1]s",status="settled"}) - max(dno_vault_private_sales{network="%[1]s",status="settled"} offset 1d)` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }} · relayer {{ with printf `max(dno_vault_relayer_balance_eth{network="%s"})` $labels.network | query }}{{ . | first | value | printf "%.4f" }} ETH{{ else }}–{{ end }}
            📡 API requests {{ with printf `sum(increase(dno_http_request_duration_seconds_count{network="%s",route!~"/metrics|/health"}[1d]))` $labels.network | query }}{{ . | first | value | printf "%.0f" }}{{ else }}0{{ end }}

      - alert: SiteQuiet
        expr: sum by (network) (increase(dno_http_request_duration_seconds_count{role="api",route!~"/metrics|/health"}[6h])) < 1
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Nobody has used the API for 6 hours: no visitor, or the site no longer reaches it (VITE_API_URL)."

  - name: server
    rules:
      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The server's disk is {{ $value | humanizePercentage }} full."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of the server's memory is available."

      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name=~"dno.*"} / container_spec_memory_limit_bytes{name=~"dno.*"} > 0.9 and container_spec_memory_limit_bytes{name=~"dno.*"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} uses {{ $value | humanizePercentage }} of its memory limit: it will be killed and restarted."

