# Alerts go to one private Discord channel, grouped by alert and network, and say when they clear.
# Activity (what players do) and the daily recap go there too, without a "resolved" message.
route:
  receiver: discord
  group_by: [alertname, network]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    - matchers: [severity = activity]
      receiver: discord-activity
      group_wait: 10s
      repeat_interval: 30m
    - matchers: [severity = digest]
      receiver: discord-activity
      group_wait: 10s
      repeat_interval: 12h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /tmp/discord_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} [{{ .CommonLabels.network }}] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  - name: discord-activity
    discord_configs:
      - webhook_url_file: /tmp/discord_webhook
        send_resolved: false
        title: '{{ if eq .CommonLabels.severity "digest" }}🗞️{{ else }}✨{{ end }} [{{ .CommonLabels.network }}] {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

inhibit_rules:
  # The API down explains everything else about that network.
  - source_matchers: [alertname = ApiNoReplica]
    target_matchers: [severity = warning]
    equal: [network]
