name: Deploy API

# Deploys what reaches main to the live stack (/opt/dno, the real allow list) and what reaches
# dev to the testnet site's API (/opt/dno-testnet), once CI finished green on that push: it starts
# when the CI run ends instead of waiting for it, which would bill the minutes it waits. A push
# that touches nothing the API image or its stack is built from deploys nothing. Other branches
# are tested by CI and never deployed. (A workflow_run workflow always runs from main's copy.)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/do_not_open-api
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # main: the live stack; dev: the testnet site's.
  STACK_DIR: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && '/opt/dno' || '/opt/dno-testnet' }}
  DOMAIN: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && vars.API_DOMAIN || 'api.testnet.do-not-open.app' }}

jobs:
  changes:
    name: Check what changed
    # Only a green CI on a push (not a pull request) deploys; by hand, always.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: diff
        name: Does this push touch the API image or its stack?
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "api=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A merge's first parent is the branch before it: its diff is all the pull request brought.
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "$files"
          if echo "$files" | grep -qE '^(apps/api/|apps/admin/|packages/(game-spec|generator|chain-adapter)/|deploy/|pnpm-lock\.yaml|\.github/workflows/deploy-api\.yml)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"; echo "nothing the API is built from changed: no deploy"
          fi

  image:
    name: Build and push the image
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:${{ env.BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'api' || 'api-testnet' }}
      url: https://${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && vars.API_DOMAIN || 'api.testnet.do-not-open.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" "mkdir -p $STACK_DIR"
          # The testnet stack has its own compose file: API replicas over the live stack's database.
          COMPOSE=deploy/docker-compose.yml
          if [ "$STACK_DIR" != /opt/dno ]; then COMPOSE=deploy/testnet/docker-compose.yml; fi
          scp -i ~/.ssh/deploy "$COMPOSE" "$TARGET:$STACK_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy deploy/deploy.sh deploy/dno.caddy.template deploy/dno-admin.caddy.template "$TARGET:$STACK_DIR/"
          # The monitoring's files, with the live stack only (its .env stays on the server, never copied over).
          if [ "$STACK_DIR" = /opt/dno ]; then scp -i ~/.ssh/deploy -r deploy/monitoring "$TARGET:/opt/dno/"; fi
          scp -i ~/.ssh/deploy deploy/edge/docker-compose.yml deploy/edge/Caddyfile "$TARGET:/opt/edge/"
      - name: Switch to the new image
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        # The token goes on stdin, never on a command line.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "$TARGET" "bash $STACK_DIR/deploy.sh ${{ env.IMAGE }}:${{ env.SHA }} ${{ github.actor }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/health" | grep -q '"ok":true'; then
              curl -fsS "https://$DOMAIN/v1/stats"; echo; exit 0
            fi
            sleep 5
          done
          echo "the API is not answering at https://$DOMAIN" >&2
          exit 1
