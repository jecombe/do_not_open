name: Deploy API

# Deploys what reaches main to the live stack (/opt/dno, the real allow list) and what reaches
# dev to the testnet site's stack (/opt/dno-testnet, its own database), once CI is green on that
# commit. Other branches are tested by CI and never deployed.
on:
  push:
    branches: [main, dev]
    paths:
      - apps/api/**
      - apps/admin/**
      - packages/game-spec/**
      - packages/generator/**
      - packages/chain-adapter/**
      - deploy/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/do_not_open-api
  # main: the live stack; dev: the testnet site's.
  STACK_DIR: ${{ github.ref_name == 'main' && '/opt/dno' || '/opt/dno-testnet' }}
  DOMAIN: ${{ github.ref_name == 'main' && vars.API_DOMAIN || 'api.testnet.do-not-open.app' }}

jobs:
  ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # The whole CI (web, contracts, API, Postgres) must be green on this commit: a red main never deploys.
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 120); do
            run=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ]; then
              status=$(echo "$run" | jq -r .status)
              conclusion=$(echo "$run" | jq -r .conclusion)
              if [ "$status" = completed ]; then
                echo "CI: $conclusion ($(echo "$run" | jq -r .url))"
                [ "$conclusion" = success ] && exit 0
                echo "CI did not pass on $SHA: nothing is deployed." >&2
                exit 1
              fi
            fi
            sleep 15
          done
          echo "CI did not finish within 30 minutes." >&2
          exit 1

  image:
    name: Build and push the image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'api' || 'api-testnet' }}
      url: https://${{ github.ref_name == 'main' && vars.API_DOMAIN || 'api.testnet.do-not-open.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/deploy "$TARGET" "mkdir -p $STACK_DIR"
          # The testnet stack has its own compose file: API replicas over the live stack's database.
          COMPOSE=deploy/docker-compose.yml
          if [ "$STACK_DIR" != /opt/dno ]; then COMPOSE=deploy/testnet/docker-compose.yml; fi
          scp -i ~/.ssh/deploy "$COMPOSE" "$TARGET:$STACK_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy deploy/deploy.sh deploy/dno.caddy.template deploy/dno-admin.caddy.template "$TARGET:$STACK_DIR/"
          # The monitoring's files, with the live stack only (its .env stays on the server, never copied over).
          if [ "$STACK_DIR" = /opt/dno ]; then scp -i ~/.ssh/deploy -r deploy/monitoring "$TARGET:/opt/dno/"; fi
          scp -i ~/.ssh/deploy deploy/edge/docker-compose.yml deploy/edge/Caddyfile "$TARGET:/opt/edge/"
      - name: Switch to the new image
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        # The token goes on stdin, never on a command line.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "$TARGET" "bash $STACK_DIR/deploy.sh ${{ env.IMAGE }}:${{ github.sha }} ${{ github.actor }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/health" | grep -q '"ok":true'; then
              curl -fsS "https://$DOMAIN/v1/stats"; echo; exit 0
            fi
            sleep 5
          done
          echo "the API is not answering at https://$DOMAIN" >&2
          exit 1
