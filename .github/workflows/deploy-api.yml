name: Deploy API

# The backend is one server for Sepolia: dev and main both deploy to it.
on:
  push:
    branches: [main, dev]
    paths:
      - apps/api/**
      - packages/game-spec/**
      - packages/generator/**
      - packages/chain-adapter/**
      - deploy/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/do_not_open-api

jobs:
  test:
    name: Test the API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dno
          POSTGRES_PASSWORD: dno
          POSTGRES_DB: dno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dno -d dno_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dno:dno@localhost:5432/dno_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@dno/api..."
      - run: pnpm --filter @dno/api typecheck
      - run: pnpm --filter @dno/api test

  image:
    name: Build and push the image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: api
      url: https://${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the stack
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy deploy/docker-compose.yml deploy/deploy.sh deploy/dno.caddy.template "$TARGET:/opt/dno/"
          scp -i ~/.ssh/deploy deploy/edge/docker-compose.yml deploy/edge/Caddyfile "$TARGET:/opt/edge/"
      - name: Switch to the new image
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        # The token goes on stdin, never on a command line.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy "$TARGET" "bash /opt/dno/deploy.sh ${{ env.IMAGE }}:${{ github.sha }} ${{ github.actor }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/health" | grep -q '"ok":true'; then
              curl -fsS "https://${{ vars.API_DOMAIN }}/v1/stats"; echo; exit 0
            fi
            sleep 5
          done
          echo "the API is not answering at https://${{ vars.API_DOMAIN }}" >&2
          exit 1
