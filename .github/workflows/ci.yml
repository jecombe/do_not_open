name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    services:
      # The API's store tests run against a real Postgres too.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dno
          POSTGRES_PASSWORD: dno
          POSTGRES_DB: dno_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dno -d dno_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dno:dno@localhost:5432/dno_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates the contract types (gitignored) the typecheck needs.
      - run: pnpm --filter @dno/contracts-evm compile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle the API
        run: pnpm --filter @dno/api build
